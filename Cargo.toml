[workspace]
resolver = "2"
members = [
    "examples/conduit-example",
    "packages/*",
]

[workspace.dependencies]
uuid = { version = "1.14.0", features = ["v4"] }
pest = { version = "2.7.15", features = ["pretty-print"] }
pest_derive = { version = "2.7.15" }
thiserror = "2.0.12"
inventory = "0.3.20"
petgraph = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
conduit = { path = "./packages/conduit" }
async-trait = "0.1"
conduit-derive = { path = "./packages/conduit-derive" }
